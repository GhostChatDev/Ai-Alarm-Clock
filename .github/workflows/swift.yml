name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Verify Swift package & logic tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Typecheck all Swift app & theme files against iOS Simulator SDK
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          xcrun swiftc -typecheck \
            -sdk "$SDK_PATH" \
            -target "${ARCH}-apple-ios17.0-simulator" \
            -parse-as-library \
            ReadyByEight/AlarmModels.swift \
            ReadyByEight/AppStore.swift \
            ReadyByEight/CoachView.swift \
            ReadyByEight/ReadyByEightApp.swift \
            GhostTheme.swift

      - name: Run reminder logic tests
        run: swift test --disable-sandbox -v

