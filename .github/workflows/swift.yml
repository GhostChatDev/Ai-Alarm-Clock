name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Logic tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run reminder logic tests
        run: swift test --disable-sandbox -v

  build:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Ready by Eight
        run: |
          set -o pipefail
          xcodebuild \
            -project ReadyByEight.xcodeproj \
            -scheme ReadyByEight \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log
