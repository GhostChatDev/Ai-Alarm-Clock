name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Logic tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run reminder logic tests
        run: swift test --disable-sandbox -v

  build:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: List simulators
        run: xcrun simctl list devices available

      - name: Build Ready by Eight
        run: |
          set -euo pipefail
          DESTINATION="$(
            xcrun simctl list devices available |
            awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }'
          )"
          if [ -z "${DESTINATION}" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          xcodebuild \
            -project ReadyByEight.xcodeproj \
            -scheme ReadyByEight \
            -destination "platform=iOS Simulator,id=${DESTINATION}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
