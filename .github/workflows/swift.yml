name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Logic tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run reminder logic tests
        run: swift test --disable-sandbox -v

  build:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Ready by Eight
        run: |
          set -euo pipefail
          xcodebuild \
            -project ReadyByEight.xcodeproj \
            -scheme ReadyByEight \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
