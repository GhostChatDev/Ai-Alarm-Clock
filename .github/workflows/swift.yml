name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Logic tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run reminder logic tests
        run: swift test --disable-sandbox -v

  typecheck:
    name: Typecheck all Swift files
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Typecheck iOS Swift sources and theme
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc \
            -typecheck \
            -sdk "${SDK_PATH}" \
            -target arm64-apple-ios17.0-simulator \
            ReadyByEight/AlarmModels.swift \
            ReadyByEight/AppStore.swift \
            ReadyByEight/CoachView.swift \
            ReadyByEight/ReadyByEightApp.swift \
            GhostTheme.swift
