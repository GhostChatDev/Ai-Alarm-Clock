name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Logic tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run reminder logic tests
        run: swift test --disable-sandbox

  build:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Write XcodeGen spec
        run: |
          cat > ci-project.yml <<'YAML'
          name: ReadyByEight
          options:
            bundleIdPrefix: dev.ghostchat
            deploymentTarget:
              iOS: "17.0"
            createIntermediateGroups: true
          targets:
            ReadyByEight:
              type: application
              platform: iOS
              sources:
                - path: ReadyByEight
                - path: GhostTheme.swift
                - path: AppStore.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.ghostchat.ReadyByEight
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "Ready by Eight"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          schemes:
            ReadyByEight:
              build:
                targets:
                  ReadyByEight: all
              run:
                config: Debug
          YAML
          cat ci-project.yml

      - name: Generate the Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate --spec ci-project.yml

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project ReadyByEight.xcodeproj -scheme ReadyByEight \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          echo "---- errors ----"
          grep -E "error:" build.log | sort -u || true
          grep -q "BUILD SUCCEEDED" build.log
