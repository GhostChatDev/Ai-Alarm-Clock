name: GhostMascot
options:
  bundleIdPrefix: dev.ghostchat
  deploymentTarget:
    iOS: "17.0"
targets:
  GhostMascot:
    type: application
    platform: iOS
    sources:
      - path: ReadyByEight
      - path: GhostTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ghostchat.ghostmascot
        PRODUCT_NAME: GhostMascot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Ghost Mascot"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Ghost Mascot reads your sleep stages (REM, Deep, Core) from Apple Health to show your nightly hypnogram."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Ghost Mascot saves sleep sessions you track in the app back to Apple Health."
        INFOPLIST_KEY_NSMotionUsageDescription: "Ghost Mascot uses device motion for live-wallpaper tilt parallax and optional mattress sleep tracking."
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        CODE_SIGNING_ALLOWED: NO
schemes:
  GhostMascot:
    build:
      targets:
        GhostMascot: all
