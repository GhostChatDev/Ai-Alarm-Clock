name: ReadyByEight
options:
  bundleIdPrefix: com.readybyeight
  deploymentTarget:
    iOS: "17.0"
targets:
  ReadyByEight:
    type: application
    platform: iOS
    sources:
      - path: ReadyByEight
      - path: GhostTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ghostchat.ReadyByEight
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Ready by Eight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  ReadyByEight:
    build:
      targets:
        ReadyByEight: all
