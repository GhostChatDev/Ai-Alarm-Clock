name: ReadyByEight
options:
  bundleIdPrefix: com.readybyeight
  deploymentTarget:
    iOS: "17.0"
targets:
  ReadyByEight:
    type: application
    platform: iOS
    sources:
      - path: ReadyByEight
      - path: GhostTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readybyeight.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  ReadyByEight:
    build:
      targets:
        ReadyByEight: all
