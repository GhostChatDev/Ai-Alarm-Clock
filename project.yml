name: GhostMascot
options:
  bundleIdPrefix: dev.ghostchat
  deploymentTarget:
    iOS: "17.0"
targets:
  GhostMascot:
    type: application
    platform: iOS
    sources:
      - path: ReadyByEight
      - path: GhostTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ghostchat.ghostmascot
        PRODUCT_NAME: GhostMascot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Ghost Mascot"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  GhostMascot:
    build:
      targets:
        GhostMascot: all
